services:
  web:
    build: ./web
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
  db:
    image: postgres:18.6-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
      HTTP_ADDR: :8080
      DB_TIMEOUT: 2s
      SEED_DATA: "true"
      APP_ENV: ${APP_ENV:-development}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      LLM_MOCK_SCENARIO: happy
      LLM_MOCK_MESSAGE_SCENARIO: happy
      LLM_MOCK_CHUNK_DELAY: 10ms
      LLM_TIMEOUT: ${LLM_TIMEOUT:-10s}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  mockprovider:
    build: .
    entrypoint: ["/mockprovider"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
      HTTP_ADDR: :8081
      DB_TIMEOUT: 2s
      FAULT_SEED: "1"
      FAULT_RATE_5XX: ${FAULT_RATE_5XX:-0.05}
      FAULT_RATE_429: ${FAULT_RATE_429:-0.02}
      FAULT_LATENCY_P95_MS: ${FAULT_LATENCY_P95_MS:-20}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
  worker:
    build: .
    entrypoint: ["/worker"]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
      DB_TIMEOUT: 2s
      PROVIDER_BASE_URL: http://mockprovider:8081
      PROVIDER_TIMEOUT: 3s
      WORKER_LEASE: 30s
      WORKER_POLL: 100ms
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
    depends_on:
      mockprovider:
        condition: service_started
    stop_grace_period: 10s
    restart: unless-stopped
  test:
    build:
      context: .
      target: build
    profiles: ["test"]
    working_dir: /src
    environment:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://app:app@db:5432/scc_test?sslmode=disable
    command: ["go", "test", "-mod=readonly", "-tags=integration", "./internal/store"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres18_data:
