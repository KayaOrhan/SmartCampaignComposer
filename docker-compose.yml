services:
  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
  api:
    build: .
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app?sslmode=disable
      HTTP_ADDR: :8080
      DB_TIMEOUT: 2s
      SEED_DATA: "true"
      APP_ENV: ${APP_ENV:-development}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      LLM_MOCK_SCENARIO: happy
      LLM_MOCK_MESSAGE_SCENARIO: happy
      LLM_MOCK_CHUNK_DELAY: 10ms
      LLM_TIMEOUT: ${LLM_TIMEOUT:-10s}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  test:
    build:
      context: .
      target: build
    profiles: ["test"]
    working_dir: /src
    environment:
      APP_ENV: test
      TEST_DATABASE_URL: postgres://app:app@db:5432/scc_test?sslmode=disable
    command: ["go", "test", "-mod=readonly", "-tags=integration", "./internal/store"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
